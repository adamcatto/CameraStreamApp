name: Windows build

on:
  push:
    branches: [main, windows-port, feature/web-monorepo]
  pull_request:
    branches: [windows-port, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build, package, and smoke test
        shell: pwsh
        run: |
          Set-Location apps/windows
          ./package-windows.ps1

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraStream-Windows
          path: dist/windows/CameraStream-Windows.zip
          if-no-files-found: error
